<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard — Solitaire</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #leaderboard-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 28px;
            background: rgba(0,0,0,0.25);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        #leaderboard-header h1 {
            font-size: 22px;
            font-weight: 700;
        }
        #leaderboard-main {
            padding: 32px 28px;
            max-width: 720px;
            margin: 0 auto;
        }
        #no-players {
            text-align: center;
            opacity: 0.55;
            margin-top: 60px;
            font-size: 16px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 15px;
        }
        thead tr {
            background: rgba(0,0,0,0.25);
        }
        th {
            padding: 12px 14px;
            text-align: left;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            opacity: 0.65;
            font-weight: 600;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        td {
            padding: 12px 14px;
            border-bottom: 1px solid rgba(255,255,255,0.07);
        }
        tbody tr:hover {
            background: rgba(255,255,255,0.05);
        }
        .rank-1 td { color: #ffd700; font-weight: 700; }
        .rank-2 td { color: #c0c0c0; }
        .rank-3 td { color: #cd7f32; }
        .rank-cell { font-size: 18px; text-align: center; width: 40px; }
        .rate-cell { font-weight: 600; }
        .back-btn {
            font-size: 14px;
            padding: 7px 16px;
            text-decoration: none;
            display: inline-block;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 6px;
            color: #fff;
            transition: background 0.15s;
        }
        .back-btn:hover { background: rgba(255,255,255,0.25); }
    </style>
</head>
<body>

    <div id="leaderboard-header">
        <h1>🏆 Leaderboard</h1>
        <a href="index.html" class="back-btn">← Back to Game</a>
    </div>

    <div id="leaderboard-main">
        <div id="no-players" class="hidden">No players yet — play some games first!</div>
        <table id="leaderboard-table" class="hidden">
            <thead>
                <tr>
                    <th class="rank-cell">Rank</th>
                    <th>Player</th>
                    <th>Games</th>
                    <th>Wins</th>
                    <th>Losses</th>
                    <th>Win Rate</th>
                    <th>Best Time</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body"></tbody>
        </table>
    </div>

    <script>
        const STORAGE_KEY = 'solitaire_stats_v1';

        function formatTime(s) {
            if (s === null) return '--:--';
            const m = Math.floor(s / 60);
            const sec = s % 60;
            return m + ':' + sec.toString().padStart(2, '0');
        }

        function buildLeaderboard() {
            let all = {};
            try { all = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch (e) {}

            const players = Object.entries(all).map(([name, s]) => ({
                name,
                played:   s.played || 0,
                wins:     s.wins || 0,
                losses:   (s.played || 0) - (s.wins || 0),
                rate:     s.played > 0 ? (s.wins / s.played) : 0,
                bestTime: s.bestTime || null
            }));

            if (players.length === 0) {
                document.getElementById('no-players').classList.remove('hidden');
                return;
            }

            // Sort by win rate desc, then by total wins desc
            players.sort((a, b) => b.rate - a.rate || b.wins - a.wins);

            const medals = ['🥇','🥈','🥉'];
            const tbody = document.getElementById('leaderboard-body');

            players.forEach((p, i) => {
                const rank = i + 1;
                const tr = document.createElement('tr');
                if (rank <= 3) tr.className = `rank-${rank}`;
                tr.innerHTML = `
                    <td class="rank-cell">${medals[i] || rank}</td>
                    <td>${p.name}</td>
                    <td>${p.played}</td>
                    <td>${p.wins}</td>
                    <td>${p.losses}</td>
                    <td class="rate-cell">${Math.round(p.rate * 100)}%</td>
                    <td>${formatTime(p.bestTime)}</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('leaderboard-table').classList.remove('hidden');
        }

        buildLeaderboard();
    </script>
</body>
</html>
