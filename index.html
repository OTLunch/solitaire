<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solitaire</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Player Selection Modal -->
    <div id="player-modal" class="modal">
        <div class="modal-content">
            <h2>Solitaire</h2>
            <div id="existing-players"></div>
            <div id="new-player-section">
                <input type="text" id="player-name-input" placeholder="Enter your name" maxlength="20" autocomplete="off">
                <p id="name-error"></p>
                <button id="start-btn">Start Playing</button>
            </div>
        </div>
    </div>

    <!-- Win Modal -->
    <div id="win-modal" class="modal hidden">
        <div class="modal-content win-content">
            <div class="win-trophy">🏆</div>
            <h2>You Win!</h2>
            <p id="win-time-display"></p>
            <p id="win-best-display"></p>
            <button id="play-again-btn">Play Again</button>
        </div>
    </div>

    <!-- Confirm New Game Modal -->
    <div id="confirm-modal" class="modal hidden">
        <div class="modal-content">
            <h2>New Game?</h2>
            <p>Are you sure you want to forfeit this game and start a new one?</p>
            <div class="confirm-buttons">
                <button id="confirm-yes-btn">Yes, New Game</button>
                <button id="confirm-no-btn">Keep Playing</button>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header>
        <div id="player-info">
            <span id="player-name-display">Player</span>
        </div>
        <div id="stats-bar">
            <div class="stat"><span class="stat-label">Games</span><span id="stat-played">0</span></div>
            <div class="stat"><span class="stat-label">Wins</span><span id="stat-wins">0</span></div>
            <div class="stat"><span class="stat-label">Losses</span><span id="stat-losses">0</span></div>
            <div class="stat"><span class="stat-label">Win Rate</span><span id="stat-rate">0%</span></div>
            <div class="stat"><span class="stat-label">Best Time</span><span id="stat-best">--:--</span></div>
        </div>
        <div id="game-controls">
            <span id="timer">0:00</span>
            <div id="history-controls">
                <button id="rewind-btn" title="Undo all moves">⏮</button>
                <button id="undo-btn" title="Undo">◀</button>
                <button id="redo-btn" title="Redo">▶</button>
                <button id="fastfwd-btn" title="Redo all moves">⏭</button>
            </div>
            <a href="leaderboard.html" id="leaderboard-link">🏆 Leaderboard</a>
            <button id="new-game-btn">New Game</button>
            <span id="move-indicator"></span>
        </div>
    </header>

    <!-- Game Board -->
    <main id="board">
        <div id="top-row">
            <div id="stock" class="pile" title="Click to draw"></div>
            <div id="waste" class="pile"></div>
            <div class="gap"></div>
            <div id="foundation-0" class="pile foundation" data-index="0" data-label="♠"></div>
            <div id="foundation-1" class="pile foundation" data-index="1" data-label="♥"></div>
            <div id="foundation-2" class="pile foundation" data-index="2" data-label="♦"></div>
            <div id="foundation-3" class="pile foundation" data-index="3" data-label="♣"></div>
        </div>
        <div id="tableau-row">
            <div id="tableau-0" class="pile tableau" data-col="0"></div>
            <div id="tableau-1" class="pile tableau" data-col="1"></div>
            <div id="tableau-2" class="pile tableau" data-col="2"></div>
            <div id="tableau-3" class="pile tableau" data-col="3"></div>
            <div id="tableau-4" class="pile tableau" data-col="4"></div>
            <div id="tableau-5" class="pile tableau" data-col="5"></div>
            <div id="tableau-6" class="pile tableau" data-col="6"></div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="game.js"></script>
</body>
</html>
